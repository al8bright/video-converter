[project]
name = "videoconverter"
version = "2.0.0"
description = "Video Converter backend: NVIDIA NVENC batch conversion queue (FFmpeg)"
authors = [
    { name = "al8bright" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    # 옛 화면(CustomTkinter). 새 화면(React)이 들어오면 지운다(PLAN.md Phase 6)
]

[project.scripts]
videoconverter = "videoconverter:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.uv]
environments = ["sys_platform == 'win32'"]
